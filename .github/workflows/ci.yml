name: Continuous Integration & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Migrations & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workspace_user
          POSTGRES_PASSWORD: workspace_secure_password
          POSTGRES_DB: workspace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace_user -d workspace_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Static Linting & Typecheck
        working-directory: ./backend
        run: npm run lint

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Apply Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://workspace_user:workspace_secure_password@localhost:5432/workspace_db?schema=public
        run: npx prisma migrate deploy

      - name: Execute Backend Automated Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://workspace_user:workspace_secure_password@localhost:5432/workspace_db?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_jwt_secret_key_12345
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_12345
        run: npm test

  frontend-ci:
    name: Frontend Lint & Production Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Typecheck & Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:5000
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker-build:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: workspace-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: workspace-frontend:test
