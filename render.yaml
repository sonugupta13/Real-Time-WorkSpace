services:
  # Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: workspace-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: workspace-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: workspace-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # Set to your production Vercel URL (e.g. https://collabspace.vercel.app)

  # Hosted Redis Instance (for BullMQ queue and response caching)
  - type: redis
    name: workspace-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Only internal services can connect

databases:
  # Hosted PostgreSQL Multi-Tenant Database
  - name: workspace-postgres
    region: oregon
    plan: starter
    databaseName: workspace_db
    user: workspace_user
